<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcadePro harness</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font: 13px/1.4 system-ui, sans-serif;
      }
      /* Fixed to the window: the log scrolls inside its panel, so the game
         frame never moves while messages arrive. */
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 420px;
        grid-template-rows: 100vh;
        background: #15171c;
        color: #e8e8e8;
      }
      #stage {
        display: grid;
        place-items: center;
        padding: 16px;
        overflow: auto;
      }
      #game {
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 24px;
        background: #000;
        box-shadow: 0 0 0 8px #2a2d35;
      }
      body.fill #game {
        width: 100%;
        height: calc(100vh - 32px);
        border-radius: 0;
        box-shadow: none;
      }
      #side {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-left: 1px solid #2a2d35;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 4px 10px;
      }
      #status {
        font-weight: 600;
      }
      #log {
        flex: 1;
        min-height: 0;
        margin: 0;
        overflow: auto;
        padding: 8px;
        background: #0d0e11;
        border-radius: 6px;
        font: 11px/1.4 ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      code {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <iframe id="game" sandbox="allow-scripts" title="Game"></iframe>
    </main>
    <aside id="side">
      <div><b>ArcadePro harness</b> (fake platform + reference shell)</div>
      <div>manifest: <code id="manifest"></code></div>
      <div>expects: <code id="expects"></code></div>
      <div id="status">loading…</div>
      <div class="row">
        <button id="play" disabled>Play</button>
        <button id="pause">Pause</button>
        <button id="resume">Resume</button>
        <button id="mute">Mute</button>
        <label><input id="fill" type="checkbox" /> fill window</label>
      </div>
      <pre id="log"></pre>
    </aside>
    <script type="module" src="./platform.ts"></script>
  </body>
</html>
